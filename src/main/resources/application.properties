spring.application.name=paymentservice
server.port=${PAYMENT_SERVICE_PORT:8086}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${PAYMENT_KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/payment-system}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${PAYMENT_KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/payment-system/protocol/openid-connect/certs}

spring.data.mongodb.uri=${PAYMENT_MONGODB_URI:mongodb://localhost:27017/paymentdb}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.kafka.bootstrap-servers=${PAYMENT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dsavitskiy.paymentservice.**
kafka.topic.payment-created=${PAYMENT_KAFKA_TOPIC_PAYMENT_CREATED:payment-created}

external.api.random-number.url=${PAYMENT_RANDOM_API_URL:https://random-data-api.com/api/v2/numbers}

logging.level.liquibase=INFO
logging.level.org.springframework.kafka=INFO